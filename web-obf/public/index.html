<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lua Obfuscator</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    textarea { width: 100%; height: 320px; font-family: monospace; }
    .row { margin-bottom: 10px; }
    button { padding: 8px 16px; }
    #out { height: 300px; }
  </style>
</head>
<body>
  <h2>Lua Obfuscator (simple)</h2>
  <div class="row">
    <label>Input Lua code</label><br>
    <textarea id="input"></textarea>
  </div>
  <div class="row">
    <label><input type="checkbox" id="encode" checked> Encode strings (base64)</label>
    <label style="margin-left:10px"><input type="checkbox" id="rename" checked> Rename locals</label>
    <label style="margin-left:10px"><input type="checkbox" id="minify" checked> Minify</label>
  </div>
  <div class="row">
    <button id="go">Obfuscate</button>
    <button id="clear">Clear</button>
  </div>
  <div class="row">
    <label>Result</label><br>
    <textarea id="out" readonly></textarea>
  </div>

  <script src="app.js"></script>
</body>
</html>
