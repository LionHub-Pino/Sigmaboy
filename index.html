<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail 10 Phút</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📧 Mail 10 Phút Của Bạn</h1>

        <div class="email-display">
            <input type="text" id="current-email" readonly placeholder="Đang chờ tạo email...">
            <button id="copy-btn">Copy</button>
        </div>
        
        <button id="gen-email-btn">Tạo Email Mới</button>
        
        <div class="inbox-container">
            <h2>Hộp thư đến (Tự động làm mới sau 5s)</h2>
            <ul id="inbox-list">
                </ul>
        </div>

        <div id="email-content-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h3 id="email-subject"></h3>
                <p><strong>Từ:</strong> <span id="email-from"></span></p>
                <p><strong>Ngày:</strong> <span id="email-date"></span></p>
                <hr>
                <div id="email-body"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
