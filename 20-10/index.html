        .container {

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* MÀU NỀN CHÍNH (KEM) */
        .body-letter {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #FDF5E6;
        }

        .letter {
            position: relative;
            z-index: 1;
        }

        .valentines {
            position: relative;
            top: 50px;
            cursor: pointer;
            animation: up 3s linear infinite;
        }

        @keyframes up {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        /* MÀU PHONG BÌ (HỒNG ĐẤT / ĐỎ ĐÔ) */
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #B76E79; 
        }

        .envelope:before {
            background-color: #B76E79; 
            content: "";
            position: absolute;
            width: 212px;
            height: 212px;
            transform: rotate(45deg);
            top: -105px;
            left: 44px;
            border-radius: 30px 0 0 0;
        }
        
        /* MÀU THIỆP (KEM/NGÀ) */
        .card {
            position: absolute;
            background-color: #FFFFF0;
            width: 270px;
            height: 170px;
            top: 5px;
            left: 15px;
            box-shadow: -5px -5px 100px rgba(0, 0, 0, 0.4);
        }

        /* MÀU VIỀN THIỆP (NÂU ĐẬM) */
        .card:before {
            content: "";
            position: absolute;
            border: 3px solid #6D4C41; 
            border-style: dotted;
            width: 240px;
            height: 140px;
            left: 12px;
            top: 12px;
        }

        /* MÀU CHỮ TRÊN THIỆP (NÂU ĐẬM) */
        .text {
            position: absolute;
            font-family: 'Brush Script MT', cursive;
            font-size: 28px;
            text-align: center;
            line-height: 25px;
            top: 19px;
            left: 85px;
            color: #6D4C41; 
        }

        /* MÀU TIM TRÊN THIỆP (ĐỎ CỔ ĐIỂN) */
        .heart {
            background-color: #C62828; 
            display: inline-block;
            height: 30px;
            margin: 0 10px;
            position: relative;
            top: 110px;
            left: 105px;
            transform: rotate(-45deg);
            width: 30px;
        }

        .heart:before,
        .heart:after {
            content: "";
            background-color: #C62828; 
            border-radius: 50%;
            height: 30px;
            position: absolute;
            width: 30px;
        }

        .heart:before {
            top: -15px;
            left: 0;
        }

        .heart:after {
            left: 15px;
            top: 0;
        }

        /* MÀU NẮP PHONG BÌ */
        .front {
            position: absolute;
            border-right: 180px solid #D19A9A; /* HỒNG ĐẤT NHẠT */
            border-top: 95px solid transparent;
            border-bottom: 100px solid transparent;
            left: 120px;
            top: 5px;
            width: 0;
            height: 0;
            z-index: 10;
        }

        .front:before {
            position: absolute;
            content: "";
            border-left: 300px solid #C48787; /* HỒNG ĐẤT ĐẬM HƠN */
            border-top: 195px solid transparent;
            left: -120px;
            top: -95px;
            width: 0;
            height: 0;
        }

        .shadow {
            position: absolute;
            width: 330px;
            height: 25px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3);
            top: 265px;
            left: -15px;
            animation: scale 3s linear infinite;
            z-index: -1;
        }

        @keyframes scale {

            0%,
            100% {
                transform: scaleX(1);
            }

            50% {
                transform: scaleX(0.85);
            }
        }

        /* MÀU NỀN CHÍNH (KEM) */
        #castle {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #FDF5E6; 
        }
    </style>
    <style>
        svg {

            width: 80%;
            display: block;
            position: absolute;
            margin: auto;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;
        }

        /* MÀU CHỮ SVG (NÂU ĐẬM) */
        text {
            fill: #6D4C41; 
            font-family: consolas;
            font-size: 9px;
        }

        p {
            position: absolute;
            z-index: 2
        }

        .wrapperLetterForm {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            display: none;
        }

        .boxLetter {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MÀU NỀN THƯ (KEM) */
        .boxLetter .formLetter {
            position: relative;
            width: 600px;
            /* TĂNG CHIỀU CAO ĐỂ CÓ CHỖ CHO ẢNH */
            height: 500px; 
            background-color: #FFFFF0; 
            border-radius: 20px;
            z-index: 100;
            padding: 20px 15px;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
        }

        /* MÀU VIỀN THƯ (HỒNG ĐẤT) */
        .formLetter .wrapperLetter {
            position: relative;
            width: 100%;
            height: 100%;
            border: 2px dashed #B76E79; 
            border-radius: inherit;
            display: flex;
        }

        .boxLetter .before {
            position: absolute;
            width: 600px;
            /* TĂNG CHIỀU CAO ĐỂ CÓ CHỖ CHO ẢNH */
            height: 500px;
            background: #fff;
            transform: rotate(-15deg);
            border-radius: 20px;
            z-index: 10;
        }

        /* MÀU NỀN TIM TRANG TRÍ (KEM NHẠT) */
        .formLetter .heartLetter {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #FDF5E6; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* MÀU TIM TRANG TRÍ (ĐỎ CỔ ĐIỂN) */
        .heartLetter .heartLetterItem {
            position: relative;
            width: 10px;
            height: 10px;
            transform: rotate(45deg);
            background: #C62828; 
        }

        .heartLetter:first-child {
            right: 5px;
            top: 10px;
        }

        .heartLetter:nth-child(2) {
            left: 5px;
            bottom: 10px;
        }

        .heartLetterItem::before,
        .heartLetterItem::after {
            position: absolute;
            content: '';
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
        }

        .heartLetterItem::before {
            top: -50%;
        }

        .heartLetterItem::after {
            left: -50%;
        }


        .textLetter {
            width: 100%;
            flex-direction: column;
            justify-content: center;
            display: flex;
            align-items: center;
            user-select: none;
            /* Thêm padding để ảnh không bị dính sát */
            padding-top: 15px;
        }
        
        /* MÀU TIÊU ĐỀ THƯ (NÂU) */
        .textLetter h2 {
            font-size: 30px;
            font-family: 'Dancing Script', cursive;
            color: #5D4037; 
        }

        /* MÀU NỘI DUNG THƯ (NÂU ĐẬM) */
        .textLetter .contentLetter {
            font-size: 19px;
            text-align: center;
            padding: 0px 30px;
            margin-top: 10px;
            font-family: 'Dancing Script', cursive;
            position: initial;
            color: #3E2723; 

        }

        .fa-xmark {
            position: absolute;
            right: 20px;
            top: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 25px;
        }
        
        /* *** THÊM STYLE CHO ẢNH CỦA MẸ *** */
        .mom-image {
            width: 150px; /* Kích thước ảnh */
            height: 150px;
            border-radius: 50%; /* Bo tròn ảnh */
            object-fit: cover; /* Giữ tỷ lệ ảnh */
            border: 4px solid #B76E79; /* Viền màu hồng đất */
            margin-bottom: 15px; /* Khoảng cách với chữ */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Thêm bóng mờ */
        }
        
    </style>
</head>

    <script>
        // Lấy các thành phần của SVG
        var leafOne = document.querySelector('.leafOne');
        var stickLine = document.querySelector('.stickLine');
        var leafTwo = document.querySelector('.leafTwo');
        var leafS1 = document.querySelector('.leafS1');
        var rose1 = document.querySelector('.rose1');
        var rose2 = document.querySelector('.rose2');
        var rose3 = document.querySelector('.rose3');
        var rose4 = document.querySelector('.rose4');
        var allPaths = [leafOne, stickLine, leafTwo, leafS1, rose1, rose2, rose3, rose4];

        // Dùng anime.js để vẽ
        var lineDrawing = anime({
            targets: allPaths,
            strokeDashoffset: [anime.setDashoffset, 0],
            easing: 'easeInOutCubic',
            duration: 4000,
            begin: function (anim) {
                // Khi bắt đầu: Đặt nét vẽ là màu đen, không tô màu
                allPaths.forEach(function(p) {
                    if (p) { // Kiểm tra xem phần tử có tồn tại không
                         p.setAttribute("stroke", "black");
                         p.setAttribute("fill", "none");
                    }
                });
            },
            complete: function (anim) {
                // Khi hoàn thành: Tô màu và bỏ nét vẽ
                if (leafOne) leafOne.setAttribute("fill", "#9CDD05");
                if (leafTwo) leafTwo.setAttribute("fill", "#9CDD05");
                if (stickLine) stickLine.setAttribute("fill", "#83AA2E");
                if (leafS1) leafS1.setAttribute("fill", "#9CDD05");
                if (rose1) rose1.setAttribute("fill", "#F37D79");
                if (rose2) rose2.setAttribute("fill", "#D86666");
                if (rose3) rose3.setAttribute("fill", "#F37D79");
                if (rose4) rose4.setAttribute("fill", "#D86666");
                
                allPaths.forEach(function(p) {
                    if (p) { // Kiểm tra xem phần tử có tồn tại không
                        p.setAttribute("stroke", "none");
                    }
                });
            },
            autoplay: true,
        });
    </script>

                    this.d = d;
                    this.get_PointsRy();
                    this.previous = subpaths.length > 0 ? subpaths[subpaths.length - 1] : null;
                    this.measurePath();
                    this.get_M_Point();
                    this.get_lastCubicBezier();
                }
                get_PointsRy() {
                    this.pointsRy = [];
                    // Kiểm tra d có phải string không trước khi split
                    if (typeof this.d !== 'string') return;
                    let temp = this.d.split(/[A-Z,a-z\s,]/).filter(v => v);
                    temp.forEach(item => {
                         const parsed = parseFloat(item);
                         if (!isNaN(parsed)) { // Chỉ push số hợp lệ
                              this.pointsRy.push(parsed);
                         }
                    });
                }
                measurePath() {
                    let path = document.createElementNS(SVG_NS, "path");
                    path.setAttributeNS(null, "d", this.d);
                    this.pathLength = path.getTotalLength();
                }
                get_M_Point() {
                    if (this.previous && this.previous.pointsRy) {
                        let p = this.previous.pointsRy;
                        let l = p.length;
                        if(l >= 2) this.M_point = [p[l - 2], p[l - 1]];
                    } else if (this.pointsRy) {
                        let p = this.pointsRy;
                         if(p.length >= 2) this.M_point = [p[0], p[1]];
                    }
                }
                get_lastCubicBezier() {
                     // Kiểm tra d và M_point
                     if (typeof this.d !== 'string' || !this.M_point) return;
                    let lastIndexOfC = this.d.lastIndexOf("C");
                    if (lastIndexOfC === -1) return; // Không tìm thấy 'C'

                    let temp = this.d.substring(lastIndexOfC + 1).split(/[\s,]/).filter(v => v);
                    let _temp = [];
                    temp.forEach(item => {
                         const parsed = parseFloat(item);
                         if (!isNaN(parsed)) _temp.push(parsed);
                    });

                    this.lastCubicBezier = [this.M_point];
                    for (let i = 0; i < _temp.length; i += 2) {
                        // Đảm bảo có đủ 2 phần tử
                        if(i + 1 < _temp.length) {
                             this.lastCubicBezier.push(_temp.slice(i, i + 2));
                        }
                    }
                }
            }


            for (let i = 0; i < n; i++) {
                // Thêm kiểm tra newpos hợp lệ
                let newpos = d.indexOf("C", pos + 1);
                if (newpos === -1 && i < n -1) { // Nếu không tìm thấy C tiếp theo và chưa phải lần cuối
                     console.warn("Could not find next 'C' command in path data.");
                     break; // Thoát vòng lặp nếu path data không đúng định dạng
                }
                 if (newpos === -1) newpos = d.length; // Nếu là C cuối cùng

                if (i > 0) {
                    let pathData = d.substring(0, newpos);
                    // Thêm kiểm tra pathData không rỗng
                    if(pathData) subpaths.push(new subPath(pathData));
                }
                pos = newpos;
            }
             // Thêm kiểm tra d không rỗng
             if(d) subpaths.push(new subPath(d)); // Path cuối cùng

            let index = 0; // Khởi tạo index

            function get_T(t, currentIndex) { // Đổi tên tham số để tránh nhầm lẫn
                lengthAtT = pathlength * t;
                // Thêm kiểm tra subpaths[currentIndex] và previous tồn tại
                if (currentIndex > 0 && subpaths[currentIndex] && subpaths[currentIndex].previous) {
                     const currentLength = subpaths[currentIndex].pathLength;
                     const prevLength = subpaths[currentIndex].previous.pathLength;
                     // Tránh chia cho 0
                     if (currentLength > prevLength) {
                         return (lengthAtT - prevLength) / (currentLength - prevLength);
                     } else {
                          return 0; // Hoặc một giá trị mặc định khác
                     }
                } else if (subpaths[currentIndex] && subpaths[currentIndex].pathLength > 0) { // Tránh chia cho 0
                    return lengthAtT / subpaths[currentIndex].pathLength;
                }
                 return 0; // Giá trị mặc định nếu không tính được
            }

            function lerp(A, B, t) {
                 // Thêm kiểm tra A, B là mảng và có ít nhất 2 phần tử
                 if (!Array.isArray(A) || A.length < 2 || !Array.isArray(B) || B.length < 2) {
                     return [0, 0]; // Trả về giá trị mặc định
                 }
                return [(B[0] - A[0]) * t + A[0], (B[1] - A[1]) * t + A[1]];
            }

            function getBezierPoints(t, points) {
                 // Kiểm tra points là mảng và có đủ 4 điểm
                 if (!Array.isArray(points) || points.length !== 4) {
                      console.error("Invalid points data for getBezierPoints");
                      return [[0,0], [0,0], [0,0], [0,0]]; // Trả về mảng điểm mặc định
                 }
                let helperPoints = [];
                for (let i = 1; i < 4; i++) {
                    helperPoints.push(lerp(points[i - 1], points[i], t));
                }
                helperPoints.push(lerp(helperPoints[0], helperPoints[1], t));
                helperPoints.push(lerp(helperPoints[1], helperPoints[2], t));
                helperPoints.push(lerp(helperPoints[3], helperPoints[4], t));
                return [points[0], helperPoints[0], helperPoints[3], helperPoints[5]];
            }

            function drawCBezier(points, path, currentIndex) { // Đổi tên tham số
                 // Thêm kiểm tra points hợp lệ
                 if (!Array.isArray(points) || points.length !== 4) return;

                let dString = ""; // Đổi tên biến để tránh nhầm lẫn
                // Kiểm tra currentIndex và subpaths
                if (currentIndex > 0 && subpaths[currentIndex] && subpaths[currentIndex].previous) {
                     dString = subpaths[currentIndex].previous.d;
                } else if (points[0] && Array.isArray(points[0]) && points[0].length >=2) { // Kiểm tra điểm bắt đầu
                    dString = `M${points[0][0]},${points[0][1]} C`;
                } else {
                     return; // Không có điểm bắt đầu hợp lệ
                }

                for (let i = 1; i < 4; i++) {
                     // Kiểm tra points[i] hợp lệ
                     if(points[i] && Array.isArray(points[i]) && points[i].length >= 2) {
                          dString += ` ${points[i][0]},${points[i][1]} `;
                     } else {
                          console.warn(`Invalid point data at index ${i} for drawCBezier`);
                          return; // Dừng nếu có điểm không hợp lệ
                     }
                }
                path.setAttributeNS(null, "d", dString);
            }

            function Typing() {
                t += 0.0025;
                if (t >= 1) {
                    t = 1;
                    window.cancelAnimationFrame(rid);
                    rid = null; // Đặt lại rid sau khi cancel
                }

                lengthAtT = pathlength * t;
                // Cập nhật lại index trong mỗi frame
                for (index = 0; index < subpaths.length; index++) {
                     // Kiểm tra subpaths[index] tồn tại
                     if (subpaths[index] && subpaths[index].pathLength >= lengthAtT) break;
                }
                 // Đảm bảo index không vượt quá giới hạn mảng
                 if (index >= subpaths.length) index = subpaths.length - 1; 

                 // Kiểm tra subpaths[index] và lastCubicBezier tồn tại
                 if (subpaths[index] && subpaths[index].lastCubicBezier) {
                     let T = get_T(t, index);
                     let newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);
                     drawCBezier(newPoints, partialPathElement, index); // Sử dụng partialPathElement
                 } else {
                      console.warn(`Subpath or lastCubicBezier not found for index ${index}`);
                      window.cancelAnimationFrame(rid); // Dừng animation nếu có lỗi
                      rid = null;
                 }
                
                if(t < 1 && rid) { // Chỉ request frame tiếp theo nếu chưa hoàn thành và rid chưa bị cancel
                    rid = window.requestAnimationFrame(Typing);
                }
            }


            const textClickElement = document.querySelector("#text-click");
            const roseTElement = document.querySelector("#rose-t");
            const castleElement = document.querySelector("#castle");
            const theSvgElement = document.querySelector("#theSvg");

            // Thêm kiểm tra các element tồn tại
            if (textClickElement) {
                setTimeout(() => {
                    textClickElement.style.display = "inherit";
                }, 4000);
            }

            if (roseTElement && castleElement && theSvgElement) {
                roseTElement.onclick = function () {
                    roseTElement.style.display = "none";
                    castleElement.style.display = "flex";
                    theSvgElement.style.display = "inherit";
                    t = 0; // Reset t khi bắt đầu animation mới
                    // Chỉ bắt đầu animation nếu rid chưa được set (tránh chạy nhiều lần)
                    if (!rid) { 
                         rid = window.requestAnimationFrame(Typing);
                    }
                }
            } else {
                 console.error("One or more elements (#rose-t, #castle, #theSvg) not found.");
            }
        })();

        // Script cho nội dung thư
        $(document).ready(function () {
            const textLetterH2 = "Gửi mẹ kính yêu!";
            const textLetterP = "Nhân ngày 20/10, con chúc mẹ luôn mạnh khỏe, vui vẻ và hạnh phúc bên gia đình mình. Cảm ơn mẹ đã luôn là chỗ dựa vững chắc cho con. Con yêu mẹ rất nhiều!";
            let textLetter = document.querySelector('.textLetter h2');
            let textLetterContent = document.querySelector('.contentLetter');
             // Thêm kiểm tra textLetter và textLetterContent tồn tại
             if(!textLetter || !textLetterContent) {
                  console.error("Elements for letter text (.textLetter h2 or .contentLetter) not found.");
                  return; // Không chạy tiếp nếu thiếu element
             }

            let indexText = 0;
            let indexTextContent = 0;
            let timoutTextLetter, timoutTextLetterContent;

            function textCharLetter() {
                if (indexText < textLetterH2.length) {
                    textLetter.textContent += textLetterH2[indexText];
                    indexText++;
                } else {
                    clearInterval(timoutTextLetter);
                    setTimeout(funcTimeoutLetterContent, 500);
                }
            }

            function funcTimeoutLetter() {
                indexText = 0;
                textLetter.textContent = '';
                clearInterval(timoutTextLetter);
                timoutTextLetter = setInterval(textCharLetter, 150);
            }

            function textCharLetterContent() {
                if (indexTextContent < textLetterP.length) {
                    textLetterContent.textContent += textLetterP[indexTextContent];
                    indexTextContent++;
                } else {
                    clearInterval(timoutTextLetterContent);
                }
            }

            function funcTimeoutLetterContent() {
                indexTextContent = 0;
                textLetterContent.textContent = '';
                clearInterval(timoutTextLetterContent);
                timoutTextLetterContent = setInterval(textCharLetterContent, 100);
            }

            // Hiệu ứng mở thiệp
            $('.valentines').mouseenter(function () {
                $('.card').stop().animate({ top: '-90px' }, 'slow');
            }).mouseleave(function () {
                $('.card').stop().animate({ top: 0 }, 'slow');
            });

            // Click vào thiệp để mở thư
            $('.card').click(function () {
                $(".wrapperLetterForm").fadeIn();
                funcTimeoutLetter(); // Bắt đầu chạy chữ
            });

            // Click dấu X để đóng thư
            $('.fa-xmark').click(function () {
                $(".wrapperLetterForm").fadeOut();
                // Dừng chạy chữ
                clearInterval(timoutTextLetter);
                clearInterval(timoutTextLetterContent);
                 // Xóa text khi đóng để lần sau mở lại chạy từ đầu
                textLetter.textContent = '';
                textLetterContent.textContent = '';
                indexText = 0; // Reset index
                indexTextContent = 0; // Reset index
            });
        });
    </script>
